<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>笔记发布助手</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { touch-action: manipulation; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      background: #f8f8f8;
      color: #333;
    }
    .page { max-width: 640px; margin: 0 auto; padding: 16px 16px 0; }
    .head { padding: 4px 0 12px; }
    .head h1 { font-size: 17px; font-weight: 600; }
    .head p { font-size: 12px; color: #999; margin-top: 4px; }
    .gallery {
      display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain; border-radius: 10px; background: #eee;
    }
    .gallery img {
      height: 320px; max-width: 100%; flex-shrink: 0; margin-right: 6px;
      border-radius: 10px; object-fit: contain; background: #eee;
    }
    .gallery img:last-child { margin-right: 0; }
    .card { background: #fff; border-radius: 10px; padding: 14px; margin-top: 12px; }
    .note-title { font-size: 16px; font-weight: 600; line-height: 1.4; -webkit-user-select: text; user-select: text; }
    .note-content { font-size: 14px; line-height: 1.7; margin-top: 8px; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
    .note-tags { margin-top: 10px; }
    .note-tags span { color: #1a5cff; font-size: 13px; margin-right: 8px; }
    .status { font-size: 12px; color: #999; text-align: center; padding: 14px 0 90px; }
    .status.error { color: #ff2442; }
    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff; box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      padding-bottom: calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    }
    .publish-btn {
      display: block; width: 100%; max-width: 608px; margin: 0 auto;
      height: 44px; border: none; border-radius: 22px;
      background: #ff2442; color: #fff; font-size: 16px; font-weight: 600;
    }
    .bottom-bar button:active { opacity: 0.85; }
    .publish-btn[disabled] { background: #ffb3c0; }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <h1>笔记发布助手</h1>
      <p>内容已就绪，点击底部按钮唤起小红书发布页</p>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="card">
      <div class="note-title" id="note-title"></div>
      <div class="note-content" id="note-content"></div>
      <div class="note-tags" id="note-tags"></div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="bottom-bar">
    <button class="publish-btn" id="publish-btn" type="button">发布到小红书</button>
  </div>
  <script src="./note.js"></script>
  <script src="./app.js"></script>
</body>
</html>
